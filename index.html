<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK TIERS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#090b10;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:22px 6%;
    background:#0e1118;
    border-bottom:1px solid #292e3a;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    color:#ff3158;
    font-size:30px;
    font-weight:900;
}

.subtitle{
    color:#858e9f;
    font-size:13px;
}

main{
    max-width:1100px;
    margin:35px auto;
    padding:0 18px;
}

.card{
    background:#12151c;
    border:1px solid #272c38;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

input,select{
    background:#0c0f15;
    color:white;
    border:1px solid #303643;
    border-radius:10px;
    padding:12px;
}

input{flex:1;min-width:200px}

button{
    background:#ff3158;
    color:white;
    border:0;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
}

button.secondary{
    background:#292e38;
}

.admin{
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:15px 8px;
    border-bottom:1px solid #272c38;
    text-align:right;
}

th{color:#858e9f}

.rank{
    color:#ff3158;
    font-weight:bold;
}

.tier{font-weight:bold}

#status{
    margin-top:15px;
    color:#858e9f;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:450px;
    background:#12151c;
    border:1px solid #303643;
    border-radius:18px;
    padding:22px;
}

.modal-box input,
.modal-box select{
    width:100%;
    margin:7px 0;
}

@media(max-width:600px){
    .logo{font-size:24px}
    th,td{font-size:13px}
}
</style>
</head>

<body>

<header>

<div>
<div class="logo">VK TIERS</div>
<div class="subtitle">Minecraft Competitive Tier List</div>
</div>

<button id="loginBtn" onclick="openLogin()">
تسجيل دخول الإدارة
</button>

<button
id="logoutBtn"
class="secondary"
onclick="logout()"
style="display:none">
تسجيل خروج
</button>

</header>

<main>

<section class="card">

<h1>VK Tiers</h1>

<p class="subtitle">
تصنيف لاعبي Minecraft
</p>

<div class="controls">

<input
id="search"
placeholder="ابحث عن لاعب..."
oninput="render()"
>

<select id="mode" onchange="render()">
<option value="all">كل الأنماط</option>
<option value="Combat">Combat</option>
<option value="Crystal">Crystal</option>
<option value="Mace">Mace</option>
<option value="Sword">Sword</option>
</select>

</div>

<div
id="adminPanel"
class="admin">

<button onclick="openAddPlayer()">
➕ إضافة لاعب
</button>

</div>

<br>

<table>

<thead>
<tr>
<th>#</th>
<th>اللاعب</th>
<th>النمط</th>
<th>Tier</th>
<th>النقاط</th>
<th class="admin">إدارة</th>
</tr>
</thead>

<tbody id="players"></tbody>

</table>

<div id="status">
جاري تحميل اللاعبين...
</div>

</section>

</main>


<!-- تسجيل الدخول -->

<div id="loginModal" class="modal">

<div class="modal-box">

<h2>تسجيل دخول الإدارة</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
>

<input
id="password"
type="password"
placeholder="كلمة المرور"
>

<button onclick="login()">
دخول
</button>

<button
class="secondary"
onclick="closeLogin()">
إلغاء
</button>

<p id="loginStatus"></p>

</div>

</div>


<!-- إضافة لاعب -->

<div id="playerModal" class="modal">

<div class="modal-box">

<h2>إضافة لاعب</h2>

<input
id="playerName"
placeholder="اسم اللاعب"
>

<select id="playerMode">
<option value="Combat">Combat</option>
<option value="Crystal">Crystal</option>
<option value="Mace">Mace</option>
<option value="Sword">Sword</option>
</select>

<input
id="playerTier"
placeholder="Tier مثل HT1"
>

<input
id="playerPoints"
type="number"
placeholder="النقاط"
>

<button onclick="addPlayer()">
إضافة
</button>

<button
class="secondary"
onclick="closePlayerModal()">
إلغاء
</button>

<p id="playerStatus"></p>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ydyugyzemtbrjbnuvyka.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Vj2BaNXlQQSrbb71D7rmfA_PxTuYtgI";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   البيانات
========================= */

let players = [];
let isAdmin = false;


/* =========================
   تحميل اللاعبين
========================= */

async function loadPlayers(){

    const status =
        document.getElementById("status");

    status.textContent =
        "جاري تحميل اللاعبين...";

    try{

        const { data, error } =
            await supabaseClient
            .from("players")
            .select("*");

        if(error)
            throw error;

        players = data || [];

        render();

        status.textContent =
            players.length +
            " لاعب محمل";

    }catch(error){

        console.error(error);

        status.textContent =
            "خطأ: " +
            error.message;
    }
}


/* =========================
   التحقق من الإدارة
========================= */

async function checkAdmin(){

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if(!user){

        setAdminUI(false);
        return;
    }

    const { data, error } =
        await supabaseClient
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();

    if(error){

        console.error(error);
        setAdminUI(false);
        return;
    }

    if(
        data &&
        (
            data.role === "owner" ||
            data.role === "admin"
        )
    ){

        setAdminUI(true);

    }else{

        setAdminUI(false);
    }
}


/* =========================
   واجهة الإدارة
========================= */

function setAdminUI(value){

    isAdmin = value;

    document
    .getElementById("adminPanel")
    .style.display =
        value ? "block" : "none";

    document
    .getElementById("loginBtn")
    .style.display =
        value ? "none" : "block";

    document
    .getElementById("logoutBtn")
    .style.display =
        value ? "block" : "none";

    document
    .querySelectorAll(".admin")
    .forEach(el => {

        el.style.display =
            value ? "table-cell" : "none";

    });

    render();
}


/* =========================
   تسجيل الدخول
========================= */

function openLogin(){

    document
    .getElementById("loginModal")
    .style.display =
        "flex";
}


function closeLogin(){

    document
    .getElementById("loginModal")
    .style.display =
        "none";
}


async function login(){

    const email =
        document
        .getElementById("email")
        .value;

    const password =
        document
        .getElementById("password")
        .value;

    const status =
        document
        .getElementById("loginStatus");

    status.textContent =
        "جاري تسجيل الدخول...";

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if(error){

        status.textContent =
            "خطأ: " +
            error.message;

        return;
    }

    closeLogin();

    await checkAdmin();
}


/* =========================
   تسجيل الخروج
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    setAdminUI(false);
}


/* =========================
   إضافة لاعب
========================= */

function openAddPlayer(){

    if(!isAdmin)
        return;

    document
    .getElementById("playerModal")
    .style.display =
        "flex";
}


function closePlayerModal(){

    document
    .getElementById("playerModal")
    .style.display =
        "none";
}


async function addPlayer(){

    if(!isAdmin)
        return;

    const name =
        document
        .getElementById("playerName")
        .value
        .trim();

    const mode =
        document
        .getElementById("playerMode")
        .value;

    const tier =
        document
        .getElementById("playerTier")
        .value
        .trim();

    const points =
        Number(
            document
            .getElementById("playerPoints")
            .value
        );

    const status =
        document
        .getElementById("playerStatus");


    if(!name || !tier){

        status.textContent =
            "اكتب اسم اللاعب والـTier";

        return;
    }


    status.textContent =
        "جاري الإضافة...";


    const { error } =
        await supabaseClient
        .from("players")
        .insert({
            name,
            mode,
            tier,
            points
        });


    if(error){

        status.textContent =
            "خطأ: " +
            error.message;

        return;
    }


    document
    .getElementById("playerName")
    .value = "";

    document
    .getElementById("playerTier")
    .value = "";

    document
    .getElementById("playerPoints")
    .value = "";

    closePlayerModal();

    await loadPlayers();
}


/* =========================
   عرض اللاعبين
========================= */

function render(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const mode =
        document
        .getElementById("mode")
        .value;


    const list =
        players
        .filter(player => {

            const name =
                String(
                    player.name || ""
                ).toLowerCase();

            return (
                name.includes(search) &&
                (
                    mode === "all" ||
                    player.mode === mode
                )
            );

        })
        .sort(
            (a,b) =>
                Number(b.points || 0) -
                Number(a.points || 0)
        );


    document
    .getElementById("players")
    .innerHTML =

    list.map(
        (player,index) => `

        <tr>

        <td class="rank">
            ${index + 1}
        </td>

        <td>
            ${escapeHTML(
                player.name || ""
            )}
        </td>

        <td>
            ${escapeHTML(
                player.mode || ""
            )}
        </td>

        <td class="tier">
            ${escapeHTML(
                player.tier || ""
            )}
        </td>

        <td>
            ${player.points || 0}
        </td>

        ${
            isAdmin
            ?
            `<td class="admin">
                <button
                onclick="deletePlayer('${player.id}')">
                حذف
                </button>
            </td>`
            :
            ""
        }

        </tr>

        `
    ).join("");
}


/* =========================
   حذف لاعب
========================= */

async function deletePlayer(id){

    if(!isAdmin)
        return;

    if(
        !confirm(
            "هل تريد حذف هذا اللاعب؟"
        )
    )
        return;


    const { error } =
        await supabaseClient
        .from("players")
        .delete()
        .eq("id", id);


    if(error){

        alert(
            "خطأ: " +
            error.message
        );

        return;
    }

    await loadPlayers();
}


/* =========================
   حماية النص
========================= */

function escapeHTML(text){

    return String(text).replace(
        /[&<>"']/g,

        character => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        })[character]
    );
}


/* =========================
   بدء الموقع
========================= */

supabaseClient.auth.onAuthStateChange(
    async () => {
        await checkAdmin();
    }
);

checkAdmin();
loadPlayers();

</script>

</body>
</html>
