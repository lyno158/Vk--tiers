<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VK TIERS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#090b10;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:22px 6%;
    background:#0e1118;
    border-bottom:1px solid #292e3a;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    color:#ff3158;
    font-size:30px;
    font-weight:900;
}

.subtitle{
    color:#858e9f;
    font-size:13px;
}

main{
    max-width:1100px;
    margin:35px auto;
    padding:0 18px;
}

.card{
    background:#12151c;
    border:1px solid #272c38;
    border-radius:18px;
    padding:22px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

input,select{
    background:#0c0f15;
    color:white;
    border:1px solid #303643;
    border-radius:10px;
    padding:12px;
}

input{
    flex:1;
    min-width:200px;
}

button{
    background:#ff3158;
    color:white;
    border:0;
    border-radius:10px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
}

button.secondary{
    background:#292e38;
}

button.danger{
    background:#8f1f35;
}

button.small{
    padding:7px 10px;
    font-size:12px;
}

.admin{
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px 8px;
    border-bottom:1px solid #272c38;
    text-align:right;
    vertical-align:middle;
}

th{
    color:#858e9f;
}

.rank{
    color:#ff3158;
    font-weight:bold;
}

.tier{
    font-weight:bold;
}

.kits{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.kit{
    background:#0c0f15;
    border:1px solid #292e3a;
    border-radius:9px;
    padding:8px;
}

.kit-name{
    font-weight:bold;
}

.kit-info{
    color:#858e9f;
    font-size:12px;
    margin-top:3px;
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

#status{
    margin-top:15px;
    color:#858e9f;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modal-box{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow:auto;
    background:#12151c;
    border:1px solid #303643;
    border-radius:18px;
    padding:22px;
}

.modal-box input,
.modal-box select{
    width:100%;
    margin:6px 0;
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.modal-buttons button{
    flex:1;
}

.kit-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:7px;
    align-items:center;
    margin:8px 0;
}

.kit-row input,
.kit-row select{
    margin:0;
}

.remove-kit{
    background:#8f1f35;
}

@media(max-width:700px){

    .logo{
        font-size:24px;
    }

    th,td{
        font-size:13px;
    }

    .kit-row{
        grid-template-columns:1fr 1fr;
    }

    .kit-row button{
        grid-column:span 2;
    }
}
</style>
</head>

<body>

<header>

<div>
<div class="logo">VK TIERS</div>
<div class="subtitle">Minecraft Competitive Tier List</div>
</div>

<div>

<button id="loginBtn" onclick="openLogin()">
🔐 دخول الإدارة
</button>

<button id="logoutBtn"
class="secondary"
onclick="logout()"
style="display:none">
تسجيل خروج
</button>

</div>

</header>


<main>

<section class="card">

<h1>VK Tiers</h1>

<p class="subtitle">
تصنيف لاعبي Minecraft
</p>

<div class="controls">

<input
id="search"
placeholder="ابحث عن لاعب..."
oninput="render()">

<select id="kitFilter" onchange="render()">
<option value="all">كل الـKits</option>
<option value="UHC">UHC</option>
<option value="Crystal">Crystal</option>
<option value="Mace">Mace</option>
<option value="Sword">Sword</option>
</select>

</div>


<div id="adminPanel" class="admin">

<button onclick="openAddPlayer()">
➕ إضافة لاعب
</button>

</div>

<br>


<table>

<thead>
<tr>

<th>#</th>
<th>اللاعب</th>
<th>الـKits</th>
<th class="admin">الإدارة</th>

</tr>
</thead>

<tbody id="players"></tbody>

</table>

<div id="status">
جاري تحميل اللاعبين...
</div>

</section>

</main>



<!-- LOGIN -->

<div id="loginModal" class="modal">

<div class="modal-box">

<h2>تسجيل دخول الإدارة</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<div class="modal-buttons">

<button onclick="login()">
دخول
</button>

<button
class="secondary"
onclick="closeLogin()">
إلغاء
</button>

</div>

<p id="loginStatus"></p>

</div>

</div>



<!-- ADD / EDIT PLAYER -->

<div id="playerModal" class="modal">

<div class="modal-box">

<h2 id="playerModalTitle">
إضافة لاعب
</h2>

<input
id="playerName"
placeholder="اسم اللاعب">

<h3>
Kits
</h3>

<div id="kitRows"></div>

<button
class="secondary"
onclick="addKitRow()">

➕ إضافة Kit

</button>

<div class="modal-buttons">

<button onclick="savePlayer()">
حفظ
</button>

<button
class="secondary"
onclick="closePlayerModal()">
إلغاء
</button>

</div>

<p id="playerStatus"></p>

</div>

</div>



<!-- EDIT KIT -->

<div id="kitModal" class="modal">

<div class="modal-box">

<h2>
تعديل Kit
</h2>

<input
id="editKitName"
placeholder="Kit">

<input
id="editKitTier"
placeholder="Tier">

<input
id="editKitPoints"
type="number"
placeholder="النقاط">

<div class="modal-buttons">

<button onclick="saveKitEdit()">
حفظ
</button>

<button
class="secondary"
onclick="closeKitModal()">
إلغاء
</button>

</div>

<p id="kitStatus"></p>

</div>

</div>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ydyugyzemtbrjbnuvyka.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Vj2BaNXlQQSrbb71D7rmfA_PxTuYtgI";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let players = [];
let playerKits = [];
let isAdmin = false;
let editingPlayerId = null;
let editingKitId = null;



/* =========================
   LOAD DATA
========================= */

async function loadData(){

    const status =
        document.getElementById("status");

    status.textContent =
        "جاري تحميل اللاعبين...";

    try{

        const playersResult =
            await supabaseClient
            .from("players")
            .select("id,name")
            .order("name");

        if(playersResult.error)
            throw playersResult.error;


        const kitsResult =
            await supabaseClient
            .from("player_kits")
            .select("id,player_id,kit,tier,points")
            .order("points",{ascending:false});

        if(kitsResult.error)
            throw kitsResult.error;


        players =
            playersResult.data || [];

        playerKits =
            kitsResult.data || [];


        render();


        status.textContent =
            players.length +
            " لاعب محمل";

    }catch(error){

        console.error(error);

        status.textContent =
            "خطأ: " +
            error.message;
    }
}



/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

    const {
        data:{user}
    } =
        await supabaseClient
        .auth
        .getUser();


    if(!user){

        setAdminUI(false);

        return;
    }


    const {data,error} =
        await supabaseClient
        .from("user_roles")
        .select("role")
        .eq("user_id",user.id)
        .maybeSingle();


    if(error){

        console.error(error);

        setAdminUI(false);

        return;
    }


    setAdminUI(
        !!(
            data &&
            (
                data.role === "owner" ||
                data.role === "admin"
            )
        )
    );
}



function setAdminUI(value){

    isAdmin = value;


    document
    .getElementById("adminPanel")
    .style.display =
        value ? "block" : "none";


    document
    .getElementById("loginBtn")
    .style.display =
        value ? "none" : "block";


    document
    .getElementById("logoutBtn")
    .style.display =
        value ? "block" : "none";


    render();
}



/* =========================
   LOGIN
========================= */

function openLogin(){

    document
    .getElementById("loginModal")
    .style.display =
        "flex";
}


function closeLogin(){

    document
    .getElementById("loginModal")
    .style.display =
        "none";
}


async function login(){

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const status =
        document.getElementById("loginStatus");


    status.textContent =
        "جاري تسجيل الدخول...";


    const {error} =
        await supabaseClient.auth
        .signInWithPassword({
            email,
            password
        });


    if(error){

        status.textContent =
            "خطأ: " +
            error.message;

        return;
    }


    closeLogin();

    await checkAdmin();
}


async function logout(){

    await supabaseClient
    .auth
    .signOut();

    setAdminUI(false);
}



/* =========================
   ADD PLAYER
========================= */

function openAddPlayer(){

    if(!isAdmin)
        return;


    editingPlayerId = null;


    document
    .getElementById("playerModalTitle")
    .textContent =
        "إضافة لاعب";


    document
    .getElementById("playerName")
    .value = "";


    document
    .getElementById("kitRows")
    .innerHTML = "";


    addKitRow();


    document
    .getElementById("playerStatus")
    .textContent = "";


    document
    .getElementById("playerModal")
    .style.display =
        "flex";
}



/* =========================
   KIT ROW
========================= */

function addKitRow(
    kit="UHC",
    tier="",
    points=""
){

    const container =
        document.getElementById("kitRows");


    const row =
        document.createElement("div");

    row.className =
        "kit-row";


    row.innerHTML = `

        <select class="new-kit">

            <option value="UHC">
                UHC
            </option>

            <option value="Crystal">
                Crystal
            </option>

            <option value="Mace">
                Mace
            </option>

            <option value="Sword">
                Sword
            </option>

        </select>

        <input
        class="new-tier"
        placeholder="Tier مثل HT1">

        <input
        class="new-points"
        type="number"
        placeholder="النقاط">

        <button
        class="remove-kit"
        onclick="this.parentElement.remove()">

        🗑️

        </button>
    `;


    row.querySelector(".new-kit").value =
        kit;

    row.querySelector(".new-tier").value =
        tier;

    row.querySelector(".new-points").value =
        points;


    container.appendChild(row);
}



/* =========================
   SAVE PLAYER
========================= */

async function savePlayer(){

    if(!isAdmin)
        return;


    const name =
        document
        .getElementById("playerName")
        .value
        .trim();


    const status =
        document
        .getElementById("playerStatus");


    if(!name){

        status.textContent =
            "اكتب اسم اللاعب";

        return;
    }


    const rows =
        [...document.querySelectorAll(".kit-row")];


    if(rows.length === 0){

        status.textContent =
            "أضف Kit واحد على الأقل";

        return;
    }


    const kits =
        rows.map(row => ({

            kit:
                row.querySelector(".new-kit")
                .value,

            tier:
                row.querySelector(".new-tier")
                .value
                .trim(),

            points:
                Number(
                    row.querySelector(".new-points")
                    .value || 0
                )

        }));


    for(const kit of kits){

        if(!kit.tier){

            status.textContent =
                "اكتب Tier لكل Kit";

            return;
        }
    }


    status.textContent =
        "جاري الحفظ...";


    try{

        let playerId =
            editingPlayerId;


        /* CREATE PLAYER */

        if(!playerId){

            const result =
                await supabaseClient
                .from("players")
                .insert({
                    name
                })
                .select("id")
                .single();


            if(result.error)
                throw result.error;


            playerId =
                result.data.id;


            const kitResult =
                await supabaseClient
                .from("player_kits")
                .insert(
                    kits.map(k => ({
                        player_id:playerId,
                        kit:k.kit,
                        tier:k.tier,
                        points:k.points
                    }))
                );


            if(kitResult.error)
                throw kitResult.error;

        }


        /* UPDATE PLAYER */

        else{

            const updateResult =
                await supabaseClient
                .from("players")
                .update({
                    name
                })
                .eq(
                    "id",
                    playerId
                );


            if(updateResult.error)
                throw updateResult.error;


            const oldKits =
                playerKits.filter(
                    k =>
                    String(k.player_id) ===
                    String(playerId)
                );


            for(const oldKit of oldKits){

                await supabaseClient
                .from("player_kits")
                .delete()
                .eq("id",oldKit.id);

            }


            const kitResult =
                await supabaseClient
                .from("player_kits")
                .insert(
                    kits.map(k => ({
                        player_id:playerId,
                        kit:k.kit,
                        tier:k.tier,
                        points:k.points
                    }))
                );


            if(kitResult.error)
                throw kitResult.error;

        }


        closePlayerModal();

        await loadData();


    }catch(error){

        console.error(error);

        status.textContent =
            "خطأ: " +
            error.message;
    }
}



/* =========================
   EDIT PLAYER
========================= */

function openEditPlayer(id){

    if(!isAdmin)
        return;


    const player =
        players.find(
            p =>
            String(p.id) ===
            String(id)
        );


    if(!player)
        return;


    editingPlayerId =
        id;


    document
    .getElementById("playerModalTitle")
    .textContent =
        "تعديل لاعب";


    document
    .getElementById("playerName")
    .value =
        player.name;


    document
    .getElementById("kitRows")
    .innerHTML = "";


    const kits =
        playerKits.filter(
            k =>
            String(k.player_id) ===
            String(id)
        );


    if(kits.length){

        kits.forEach(k => {

            addKitRow(
                k.kit,
                k.tier,
                k.points
            );

        });

    }else{

        addKitRow();

    }


    document
    .getElementById("playerStatus")
    .textContent = "";


    document
    .getElementById("playerModal")
    .style.display =
        "flex";
}



/* =========================
   DELETE PLAYER
========================= */

async function deletePlayer(id){

    if(!isAdmin)
        return;


    const player =
        players.find(
            p =>
            String(p.id) ===
            String(id)
        );


    if(!player)
        return;


    if(
        !confirm(
            "هل تريد حذف اللاعب " +
            player.name +
            " وجميع الـKits الخاصة به؟"
        )
    )
        return;


    const {error} =
        await supabaseClient
        .from("players")
        .delete()
        .eq("id",id);


    if(error){

        alert(
            "خطأ: " +
            error.message
        );

        return;
    }


    await loadData();
}



/* =========================
   DELETE KIT
========================= */

async function deleteKit(id){

    if(!isAdmin)
        return;


    if(
        !confirm(
            "هل تريد حذف هذا الـKit؟"
        )
    )
        return;


    const {error} =
        await supabaseClient
        .from("player_kits")
        .delete()
        .eq("id",id);


    if(error){

        alert(
            "خطأ: " +
            error.message
        );

        return;
    }


    await loadData();
}



/* =========================
   EDIT KIT
========================= */

function openEditKit(id){

    if(!isAdmin)
        return;


    const kit =
        playerKits.find(
            k =>
            String(k.id) ===
            String(id)
        );


    if(!kit)
        return;


    editingKitId =
        id;


    document
    .getElementById("editKitName")
    .value =
        kit.kit;


    document
    .getElementById("editKitTier")
    .value =
        kit.tier;


    document
    .getElementById("editKitPoints")
    .value =
        kit.points;


    document
    .getElementById("kitStatus")
    .textContent = "";


    document
    .getElementById("kitModal")
    .style.display =
        "flex";
}


function closeKitModal(){

    document
    .getElementById("kitModal")
    .style.display =
        "none";
}


async function saveKitEdit(){

    if(!isAdmin)
        return;


    const kit =
        document
        .getElementById("editKitName")
        .value;

    const tier =
        document
        .getElementById("editKitTier")
        .value
        .trim();

    const points =
        Number(
            document
            .getElementById("editKitPoints")
            .value || 0
        );


    const status =
        document
        .getElementById("kitStatus");


    if(!tier){

        status.textContent =
            "اكتب Tier";

        return;
    }


    const {error} =
        await supabaseClient
        .from("player_kits")
        .update({
            kit,
            tier,
            points
        })
        .eq(
            "id",
            editingKitId
        );


    if(error){

        status.textContent =
            "خطأ: " +
            error.message;

        return;
    }


    closeKitModal();

    await loadData();
}



/* =========================
   CLOSE PLAYER MODAL
========================= */

function closePlayerModal(){

    document
    .getElementById("playerModal")
    .style.display =
        "none";
}



/* =========================
   RENDER
========================= */

function render(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const kitFilter =
        document
        .getElementById("kitFilter")
        .value;


    const list =
        players.filter(player => {

            const name =
                String(
                    player.name || ""
                ).toLowerCase();


            if(
                !name.includes(search)
            )
                return false;


            if(
                kitFilter === "all"
            )
                return true;


            return playerKits.some(
                kit =>
                String(
                    kit.player_id
                ) ===
                String(player.id)

                &&

                kit.kit === kitFilter
            );

        });


    document
    .getElementById("players")
    .innerHTML =


    list.map(
        (player,index) => {

            let kits =
                playerKits.filter(
                    k =>
                    String(k.player_id) ===
                    String(player.id)
                );


            if(
                kitFilter !== "all"
            ){

                kits =
                    kits.filter(
                        k =>
                        k.kit ===
                        kitFilter
                    );

            }


            const kitsHTML =
                kits.length

                ?

                kits.map(k => `

                    <div class="kit">

                        <div class="kit-name">

                            ${escapeHTML(k.kit)}

                        </div>

                        <div class="kit-info">

                            Tier:
                            ${escapeHTML(k.tier)}

                            —
                            ${k.points || 0}
                            نقطة

                        </div>


                        ${
                            isAdmin

                            ?

                            `<div class="actions">

                                <button
                                class="small"
                                onclick="openEditKit('${k.id}')">

                                ✏️ تعديل

                                </button>


                                <button
                                class="small danger"
                                onclick="deleteKit('${k.id}')">

                                🗑️ حذف

                                </button>

                            </div>`

                            :

                            ""

                        }

                    </div>

                `).join("")

                :

                `<span class="subtitle">
                    لا توجد Kits
                </span>`;


            return `

                <tr>

                    <td class="rank">
                        ${index + 1}
                    </td>


                    <td>
                        ${escapeHTML(player.name)}
                    </td>


                    <td>

                        <div class="kits">

                            ${kitsHTML}

                        </div>

                    </td>


                    ${
                        isAdmin

                        ?

                        `<td>

                            <div class="actions">

                                <button
                                class="small"
                                onclick="openEditPlayer('${player.id}')">

                                ✏️ تعديل اللاعب

                                </button>


                                <button
                                class="small danger"
                                onclick="deletePlayer('${player.id}')">

                                🗑️ حذف اللاعب

                                </button>

                            </div>

                        </td>`

                        :

                        `<td class="admin"></td>`

                    }

                </tr>

            `;

        }

    ).join("");

}



/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

    return String(text)
    .replace(
        /[&<>"']/g,

        character => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        })[character]

    );

}



/* =========================
   AUTH EVENTS
========================= */

supabaseClient
.auth
.onAuthStateChange(
    () => {

        checkAdmin();

    }
);



/* =========================
   START
========================= */

checkAdmin();

loadData();

</script>

</body>
</html>
