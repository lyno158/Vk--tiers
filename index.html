<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK TIERS</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#090b10;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:22px 6%;
    background:#0e1118;
    border-bottom:1px solid #292e3a;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#ff3158;
    font-size:30px;
    font-weight:900;
}

.subtitle{
    color:#858e9f;
    font-size:13px;
}

button,input,select{
    background:#0c0f15;
    color:white;
    border:1px solid #303643;
    border-radius:10px;
    padding:12px;
}

button{
    background:#ff3158;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

main{
    max-width:1100px;
    margin:35px auto;
    padding:0 18px;
}

.card{
    background:#12151c;
    border:1px solid #272c38;
    border-radius:18px;
    padding:22px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

input{
    flex:1;
    min-width:200px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:15px 8px;
    border-bottom:1px solid #272c38;
    text-align:right;
}

th{
    color:#858e9f;
}

.rank{
    color:#ff3158;
    font-weight:bold;
}

.tier{
    font-weight:bold;
}

#status{
    margin-top:15px;
    color:#858e9f;
}

@media(max-width:600px){
    .logo{font-size:24px}
    th,td{font-size:13px}
}
</style>
</head>

<body>

<header>

<div>
<div class="logo">VK TIERS</div>
<div class="subtitle">Minecraft Competitive Tier List</div>
</div>

</header>

<main>

<section class="card">

<h1>VK Tiers</h1>

<p class="subtitle">
تصنيف لاعبي Minecraft
</p>

<div class="controls">

<input
id="search"
placeholder="ابحث عن لاعب..."
oninput="render()"
>

<select id="mode" onchange="render()">
<option value="all">كل الأنماط</option>
<option value="Combat">Combat</option>
<option value="Crystal">Crystal</option>
<option value="Mace">Mace</option>
<option value="Sword">Sword</option>
</select>

</div>

<table>

<thead>
<tr>
<th>#</th>
<th>اللاعب</th>
<th>النمط</th>
<th>Tier</th>
<th>النقاط</th>
</tr>
</thead>

<tbody id="players">
</tbody>

</table>

<div id="status">
جاري تحميل اللاعبين...
</div>

</section>

</main>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ydyugyzemtbrjbnuvyka.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Vj2BaNXlQQSrbb71D7rmfA_PxTuYtgI";


/* =========================
   تحميل اللاعبين
========================= */

let players = [];


async function loadPlayers(){

    const status =
        document.getElementById("status");

    status.textContent =
        "جاري تحميل اللاعبين...";

    try{

        const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/players?select=*",
            {
                method:"GET",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + SUPABASE_KEY
                }
            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        players =
            await response.json();

        render();

        status.textContent =
            players.length +
            " لاعب محمل";

    }

    catch(error){

        console.error(error);

        status.textContent =
            "ًخطأ";

    }

}


/* =========================
   عرض اللاعبين
========================= */

function render(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const mode =
        document
        .getElementById("mode")
        .value;


    const list =
        players
        .filter(player => {

            const name =
                String(
                    player.name || ""
                ).toLowerCase();

            const matchesName =
                name.includes(search);

            const matchesMode =
                mode === "all" ||
                player.mode === mode;

            return (
                matchesName &&
                matchesMode
            );

        })

        .sort(
            (a,b) =>
            Number(b.points || 0) -
            Number(a.points || 0)
        );


    document
    .getElementById("players")
    .innerHTML =

    list.map(
        (player,index) => `

        <tr>

            <td class="rank">
                ${index + 1}
            </td>

            <td>
                ${escapeHTML(
                    player.name || ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    player.mode || ""
                )}
            </td>

            <td class="tier">
                ${escapeHTML(
                    player.tier || ""
                )}
            </td>

            <td>
                ${player.points || 0}
            </td>

        </tr>

        `
    ).join("");

}


/* =========================
   حماية النص
========================= */

function escapeHTML(text){

    return String(text).replace(
        /[&<>"']/g,

        character => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        })[character]

    );

}


/* =========================
   تشغيل الموقع
========================= */

loadPlayers();

</script>

</body>
</html>
